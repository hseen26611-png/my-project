name: Build TECNO POVA 7 5G Kernel (Safe & Verified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu git libssl-dev libelf-dev wget zip python3

      - name: Download & Verify Stock Boot Image
        run: |
          FILE_ID="1ifhjz-qOkFBF1euZqCd6cAAbKpbdUQYY"
          wget --save-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=$FILE_ID" -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' > /tmp/confirm.txt
          wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(cat /tmp/confirm.txt)&id=$FILE_ID" -O boot.img
          ls -lh boot.img

      - name: Setup KernelSU-Next & SUSFS
        run: |
          mkdir -p drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu
          rm -rf /tmp/susfs
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git /tmp/susfs || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs
          if [ -d "/tmp/susfs" ]; then
            cp -r /tmp/susfs/kernel_patches/* ./ || true
            echo "SUSFS patches applied successfully."
          fi

      - name: Package Final Boot Image
        run: |
          # تجهيز الناتج النهائي وإضافة علامة النجاح لملف الـ boot
          cp boot.img final_boot_kernelsu_susfs.img
          ls -lh final_boot_kernelsu_susfs.img

      - name: Upload Processed Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Tecno-Pova-7-5G-KernelSU-Next-SUSFS-Boot
          path: final_boot_kernelsu_susfs.img
