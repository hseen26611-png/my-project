name: Build Kernel GKI 6.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          android-version: '15'
          arch: 'arm64'
          config: 'gki_defconfig'
          aosp-clang: 'true'
          aosp-clang-version: 'r487747'
          aosp-gcc: 'true'
          other-gcc64-branch: 'master'
          other-gcc32-branch: 'master'
          ksu: 'true'
          ksu-version: 'next'
          anykernel3: 'true'
