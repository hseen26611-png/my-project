name: Build KernelSU-Next with SUSFS for Dimensity 7300

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libncurses5-dev python3 python-is-python3

      - name: Setup Git Configuration
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source & Setup Toolchain
        run: |
          echo "Cloning GKI 6.1 Kernel Source..."
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-6.1 kernel_source
          cd kernel_source

          echo "Applying KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          echo "Applying SUSFS patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs_patch
          cp susfs_patch/kernel_patches/fs/* fs/
          cp susfs_patch/kernel_patches/include/linux/* include/linux/
          
          # تطبيق الرقعة الأساسية لـ SUSFS على النواة
          patch -p1 < susfs_patch/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch || true

      - name: Start Compilation
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          
          # استخدام مفرز المترجم الافتراضي لبناء النواة
          make defconfig
          make -j$(nproc)

      - name: Upload Built Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-Image
          path: kernel_source/arch/arm64/boot/Image
