name: BG7n KernelSU SUSFS Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_TAG: android12-5.10-2025-06_r3
  KSU_TAG: v3.2.4
  SUSFS_BRANCH: gki-android12-5.10
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check BG7n files
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== REPOSITORY ====="
          pwd
          ls -lah

          test -f STOCK-FINGERPRINT.txt

          if [ -f bg7n_stock.config ]; then
            echo "CONFIG_FILE=$GITHUB_WORKSPACE/bg7n_stock.config" >> "$GITHUB_ENV"
          elif [ -f config/bg7n_stock.config ]; then
            echo "CONFIG_FILE=$GITHUB_WORKSPACE/config/bg7n_stock.config" >> "$GITHUB_ENV"
          else
            echo "ERROR: bg7n_stock.config not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using config:"
          cat "$CONFIG_FILE" | head -20

      - name: Aggressive disk cleanup
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== DISK BEFORE ====="
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          echo "===== DISK AFTER ====="
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            python3 \
            rsync \
            cpio \
            lz4 \
            xz-utils \
            zip \
            unzip \
            git \
            curl \
            wget \
            ca-certificates \
            pahole

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "===== DISK AFTER DEPENDENCIES ====="
          df -h

      - name: Clone Android Common 5.10 kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_TAG" \
            https://android.googlesource.com/kernel/common \
            kernel

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD

          echo "===== KERNEL VERSION ====="
          make kernelversion

      - name: Install Android Clang
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          echo "===== DISK BEFORE CLANG ====="
          df -h

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            "$CLANG_URL" \
            -o /tmp/clang.tar.gz

          echo "===== CLANG ARCHIVE ====="
          ls -lh /tmp/clang.tar.gz

          tar \
            -xzf /tmp/clang.tar.gz \
            -C "$GITHUB_WORKSPACE/toolchain"

          rm -f /tmp/clang.tar.gz

          test -x \
            "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/clang"

          echo \
            "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin" \
            >> "$GITHUB_PATH"

          "$GITHUB_WORKSPACE/toolchain/clang-r416183b/bin/clang" \
            --version

          echo "===== DISK AFTER CLANG ====="
          df -h

      - name: Install KernelSU
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          curl \
            -LSs \
            --fail \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s "$KSU_TAG"

          test -d KernelSU

          echo "KernelSU installed."

      - name: Clone SUSFS
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "SUSFS files verified."

      - name: Apply SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU/

          cp \
            ../susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            .

          cp \
            ../susfs/kernel_patches/fs/* \
            fs/

          cp \
            ../susfs/kernel_patches/include/linux/* \
            include/linux/

          cd KernelSU

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          cd ..

          patch \
            -p1 \
            < 50_add_susfs_in_gki-android12-5.10.patch

          echo "SUSFS patch completed."

      - name: Install BG7n config
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            "$CONFIG_FILE" \
            "$GITHUB_WORKSPACE/kernel/.config"

          test -s \
            "$GITHUB_WORKSPACE/kernel/.config"

          wc -c \
            "$GITHUB_WORKSPACE/kernel/.config"

      - name: Configure KernelSU SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_SUSFS

          for sym in \
            CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP \
            CONFIG_KSU_SUSFS_AVC_LOG_SPOOFING
          do
            ./scripts/config --enable "$sym" 2>/dev/null || true
          done

          ./scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS || true
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO || true

          ./scripts/config \
            --set-str CONFIG_LOCALVERSION \
            "-android12-9-00013-gd09ef2e980e0-ab13968955"

          make \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "===== KSU/SUSFS CONFIG ====="

          grep -E \
            'CONFIG_(KSU|KSU_SUSFS|LOCALVERSION|TRIM_UNUSED_KSYMS)' \
            .config || true

      - name: Verify compiler
        shell: bash
        env:
          PATH: ${{ github.workspace }}/toolchain/clang-r416183b/bin:${{ env.PATH }}
        run: |
          set -euxo pipefail

          echo "===== CLANG ====="
          which clang
          clang --version

          echo "===== LLD ====="
          which ld.lld
          ld.lld --version

      - name: Final disk check
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== DISK BEFORE BUILD ====="
          df -h

          AVAILABLE=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')

          echo "Available KB:"
          echo "$AVAILABLE"

          if [ "$AVAILABLE" -lt 4000000 ]; then
            echo "ERROR: Less than 4 GB free before kernel build."
            exit 1
          fi

      - name: Build kernel Image
        working-directory: kernel
        shell: bash
        env:
          PATH: ${{ github.workspace }}/toolchain/clang-r416183b/bin:${{ env.PATH }}
        run: |
          set -euxo pipefail

          mkdir -p out

          echo "===== BUILD START ====="
          date

          make \
            -j2 \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          echo "===== BUILD FINISHED ====="
          date

          test -s \
            out/arch/arm64/boot/Image

          cp \
            out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/Image"

          cp \
            out/.config \
            "$GITHUB_WORKSPACE/final.config"

      - name: Verify Image
        shell: bash
        run: |
          set -euxo pipefail

          test -s Image
          test -s final.config

          file Image
          ls -lh Image

          sha256sum Image

          strings Image \
            | grep -m10 \
            -E '5\.10\.237|android12-9|d09ef2e980e0' \
            || true

      - name: Create build information
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact

          cp Image artifact/
          cp final.config artifact/
          cp STOCK-FINGERPRINT.txt artifact/

          cat > artifact/BUILD-INFO.txt <<'EOF'
TECNO BG7n
KernelSU + SUSFS

Kernel:
5.10.237

GKI:
android12-5.10-2025-06_r3

KernelSU:
v3.2.4

SUSFS:
gki-android12-5.10

Architecture:
arm64

Build:
Image only

IMPORTANT:
This is NOT a flashable boot.img.

Do NOT flash Image directly.

The stock boot/vendor_boot/DTB/DTBO layout must be
verified before creating a flashable image.
EOF

      - name: Create ZIP
        shell: bash
        run: |
          set -euxo pipefail

          cd artifact

          zip -9 \
            ../BG7n-KernelSU-SUSFS-Image-test.zip \
            Image \
            final.config \
            STOCK-FINGERPRINT.txt \
            BUILD-INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BG7n-KernelSU-SUSFS-Image-test
          path: |
            BG7n-KernelSU-SUSFS-Image-test.zip
            Image
            final.config
            artifact/BUILD-INFO.txt
