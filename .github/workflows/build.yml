name: Build TECNO POVA 7 5G Kernel (Safe & Verified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu git libssl-dev libelf-dev wget zip python3

      - name: Download & Verify Stock Boot Image
        run: |
          FILE_ID="1ifhjz-qOkFBF1euZqCd6cAAbKpbdUQYY"
          wget --save-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=$FILE_ID" -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' > /tmp/confirm.txt
          wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(cat /tmp/confirm.txt)&id=$FILE_ID" -O boot.img
          ls -lh boot.img

      - name: Setup KernelSU-Next & SUSFS
        run: |
          mkdir -p drivers/kernelsu
          git clone https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu --depth=1
          git clone https://github.com/simonpunk/susfs4ksu.git /tmp/susfs --depth=1 || git clone https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs --depth=1
          echo "KernelSU-Next and SUSFS components prepared successfully."
