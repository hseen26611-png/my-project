name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel GKI 6.1
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://android.googlesource.com/kernel/common
          kernel-branch: common-android14-6.1
          config: gki_defconfig
          arch: arm64
          aosp-clang: true
          aosp-gcc: true
          android-version: 15
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
