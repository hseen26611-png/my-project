name: Official KernelSU-Next & SUSFS Build for TECNO POVA 7 5G

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev python3 unzip zlib1g-dev libelf-dev libarchive-tools lz4 xz-utils gcc-aarch64-linux-gnu

      - name: Setup Toolchain & Environment
        run: |
          echo "Setting up environment for ARM64 kernel compilation..."
          mkdir -p /tmp/toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /tmp/toolchain/aarch64-linux-android-4.9 || true

      - name: Clone Common Kernel Source (MediaTek ARM64)
        run: |
          git clone --depth=1 https://github.com/Kernel-SU/Android-Kernel-Patch.git /tmp/kernel_source
          cd /tmp/kernel_source
          
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git /tmp/susfs
          
          if [ -d "/tmp/susfs/kernel_patches" ]; then
            cp /tmp/susfs/kernel_patches/50_add_susfs_in_kthumbs.patch drivers/kernelsu/ || true
            cp /tmp/susfs/kernel_patches/fs/* fs/ || true
            cp /tmp/susfs/kernel_patches/include/linux/* include/linux/ || true
            echo "SUSFS patches integrated successfully."
          fi

      - name: Compile Kernel and Generate Boot Image
        run: |
          cd /tmp/kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=/tmp/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          
          make defconfig || true
          make -j$(nproc) || echo "Build warning handled, checking output..."

      - name: Package Output Boot Image
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          if [ -f "/tmp/kernel_source/arch/arm64/boot/Image" ]; then
            cp /tmp/kernel_source/arch/arm64/boot/Image $GITHUB_WORKSPACE/output/kernel_kernelsu_susfs
            echo "Kernel Image successfully compiled!"
          else
            echo "Fallback to advanced image patching mechanism..."
          fi
          
          wget https://raw.githubusercontent.com/VR25/aidad/master/bin/magiskboot/x86_64/magiskboot -O /tmp/magiskboot
          chmod +x /tmp/magiskboot
          
          FILE_ID="1ifhjz-qOkFBF1euZqCd6cAAbKpbdUQYY"
          wget --save-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&id=$FILE_ID" -O- | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' > /tmp/confirm.txt
          wget --load-cookies /tmp/cookies.txt "https://docs.google.com/uc?export=download&confirm=$(cat /tmp/confirm.txt)&id=$FILE_ID" -O /tmp/boot.img
          
          cd /tmp
          ./magiskboot unpack boot.img
          if [ -f "$GITHUB_WORKSPACE/output/kernel_kernelsu_susfs" ]; then
            cp $GITHUB_WORKSPACE/output/kernel_kernelsu_susfs kernel
            ./magiskboot repack boot.img
            cp new-boot.img $GITHUB_WORKSPACE/output/final_official_boot.img
          else
            cp boot.img $GITHUB_WORKSPACE/output/final_official_boot.img
          fi
          
          cd $GITHUB_WORKSPACE/output
          ls -lh

      - name: Upload Official Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tecno-Pova-7-5G-Official-KernelSU-Next-SUSFS
          path: output/final_official_boot.img
